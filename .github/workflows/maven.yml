name: Java CI with Maven (Equilibra Backend)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Permissões mínimas: leitura do código + escrita para comentários em PRs e checks
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Roda a suíte completa (unitários + integração com Testcontainers).
    # O runner Ubuntu já dispõe de Docker; o PostgreSQL sobe via Testcontainers
    # e todos os segredos de teste vêm de application-test.properties (valores fake).
    - name: Build and Run All Tests
      run: mvn clean test -f pom.xml

    # Publica tabela passou/falhou por teste no summary e anota falhas no PR
    - name: Publicar relatório JUnit
      if: always()
      uses: mikepenz/action-junit-report@v5
      with:
        report_paths: 'target/surefire-reports/*.xml'
        check_name: 'Resultado dos Testes (Backend)'
        fail_on_failure: true
        require_tests: true
        detailed_summary: true
        token: ${{ secrets.GITHUB_TOKEN }}

    # Publica % de cobertura por pacote no summary e como comentário no PR
    - name: Publicar cobertura JaCoCo
      if: always()
      uses: madrapps/jacoco-report@v1.7.1
      with:
        paths: target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: 'Cobertura de Código (Backend)'
        update-comment: true
        min-coverage-overall: 0
        min-coverage-changed-files: 0

    # Sobe HTML do JaCoCo e XMLs do Surefire para download/navegação offline
    - name: Upload artefatos (cobertura + testes)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: relatorios-backend-${{ github.run_number }}
        path: |
          target/site/jacoco/
          target/surefire-reports/
        retention-days: 30
