name: Java CI with Maven (Equilibra Backend)

# Triggers (Gatilhos)
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # Roda APENAS testes unitários (sem @SpringBootTest).
    # Testes listados explicitamente para evitar que classes de integração
    # (que precisam de Docker + variáveis de ambiente) sejam executadas.
    - name: Build and Run Unit Tests
      run: |
        mvn test -f pom.xml \
          -Dtest="org.app_financeiro.backend.service.UsuarioServiceTest,\
        org.app_financeiro.backend.service.ContaServiceTest,\
        org.app_financeiro.backend.service.CartaoServiceTest,\
        org.app_financeiro.backend.service.FaturaServiceTest,\
        org.app_financeiro.backend.service.TransacaoServiceTest,\
        org.app_financeiro.backend.service.CategoriaServiceTest,\
        org.app_financeiro.backend.service.InvestimentoServiceTest,\
        org.app_financeiro.backend.service.EmailVerificacaoServiceTest,\
        org.app_financeiro.backend.service.MovimentacaoFinanceiraServiceTest,\
        org.app_financeiro.backend.service.JwtServiceTest,\
        org.app_financeiro.backend.config.PepperedPasswordEncoderTest,\
        org.app_financeiro.backend.config.JwtAuthenticationFilterTest,\
        org.app_financeiro.backend.exception.GlobalExceptionHandlerTest"
