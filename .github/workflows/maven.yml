name: Java CI with Maven (Equilibra Backend)

# 1. Triggers (Gatilhos)
on:
  push:
    branches: [ "main" ]  # Sempre que alguém enviar código para a branch principal
  pull_request:
    branches: [ "main" ]  # Sempre que alguém abrir um pedido de integração para a main

jobs:
  build:
    # 2. Runner (Ambiente):
    runs-on: ubuntu-latest

    steps:
    # 3. Checkout:
    - uses: actions/checkout@v4

    # 4. Setup Java: Instala o JDK 25
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    # 5. Build & Test: Compila o projeto e roda os testes UNITÁRIOS
    - name: Build and Run Unit Tests
      run: >
        mvn test -f pom.xml
        "-Dtest=org.app_financeiro.backend.service.*Test,org.app_financeiro.backend.config.PepperedPasswordEncoderTest,org.app_financeiro.backend.config.JwtAuthenticationFilterTest,org.app_financeiro.backend.exception.GlobalExceptionHandlerTest"
        "-Dtest.excludes=**/FaturaSchedulerLockTest.java"

    # 6. Status check: Se chegarmos aqui, tudo passou!
    - name: Build Success Notification
      if: success()
      run: echo "O código está saudável e passou em todos os testes unitários!"
