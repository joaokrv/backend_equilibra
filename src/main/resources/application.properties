spring.application.name=backend
server.port=${PORT:8080}

# Evita falha de boot local quando Docker Desktop nao esta ativo.
# Para usar compose automatico do Spring Boot, defina SPRING_DOCKER_COMPOSE_ENABLED=true.
spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:false}

# Habilita as Virtual Threads (Java 21+) para alta performance e escalabilidade
spring.threads.virtual.enabled=true

# ─── Configuração de Banco de Dados (PostgreSQL + Flyway) ───────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:60000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:240000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:120000}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# Hibernate DDL Auto = 'validate' -> Garante que o Java NUNCA MAIS sobrescreverá o schema 
# Delega-se as criações estritamente aos scripts V1 do Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.repair-on-migrate=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Flyway Logs (Visualizar scripts de migrations rodando)
logging.level.org.flywaydb=INFO

# JWT Configuration
# SEGURANCA: jwt.secret NUNCA deve ser hardcoded. Definir via variavel de ambiente.
jwt.secret=${JWT_SECRET}
# Access Token: 1 hora em milisegundos
jwt.access-token-expiration=3600000
# Refresh Token: 7 dias em milisegundos
jwt.refresh-token-expiration=604800000

# Pepper para Hash de Senhas (Argon2)
auth.pepper=${AUTH_PEPPER}

# ─── APIs Externas (Mercado Financeiro) ─────────────────────────────────
# Token da Brapi Dev (Obter em https://brapi.dev/)
hg.api-key=${HG_API_KEY:}
brapi.token=${BRAPI_TOKEN:}

# ─── CORS ────────────────────────────────────────────────────────────────
# Origens permitidas (separar por virgula). Ex: http://localhost:3000,https://meuapp.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── Segurança de Borda (Proxy + Rate Limit) ─────────────────────────────
# Em produção atrás de proxy confiável (Render/Nginx), habilitar true para usar X-Forwarded-For.
security.trust-forwarded-for=${SECURITY_TRUST_FORWARDED_FOR:false}
# Chave mestre para habilitar/desabilitar o rate limit por ambiente.
security.rate-limit.enabled=${SECURITY_RATE_LIMIT_ENABLED:true}
# Limite de buckets em memória por IP para evitar crescimento descontrolado.
security.rate-limit.max-buckets=${SECURITY_RATE_LIMIT_MAX_BUCKETS:10000}
# Tempo de inatividade (min) para expirar buckets antigos e reduzir risco de DoS por memória.
security.rate-limit.bucket-idle-ttl-minutes=${SECURITY_RATE_LIMIT_BUCKET_IDLE_TTL_MINUTES:120}

# ─── E-mail SMTP (Brevo / SMTP relay) ───────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
mail.smtp-enabled=${MAIL_SMTP_ENABLED:true}
mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
brevo.api-key=${BREVO_API_KEY:}
brevo.from.name=${BREVO_FROM_NAME:Equilibra}
brevo.api-fallback-enabled=${BREVO_API_FALLBACK_ENABLED:true}
brevo.connect-timeout-ms=${BREVO_CONNECT_TIMEOUT_MS:10000}
brevo.read-timeout-ms=${BREVO_READ_TIMEOUT_MS:10000}

# ─── Swagger / OpenAPI ──────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ─── Actuator ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Controle Financeiro Pessoal
info.app.description=API REST para controle financeiro pessoal
info.app.version=1.0.0
