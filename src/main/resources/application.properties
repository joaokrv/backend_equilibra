spring.application.name=backend

# Habilita as Virtual Threads (Java 21+) para alta performance e escalabilidade
spring.threads.virtual.enabled=true

# ─── Configuração de Banco de Dados (PostgreSQL + Flyway) ───────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate DDL Auto = 'validate' -> Garante que o Java NUNCA MALS sobrescreverá o schema 
# Delega-se as criações estritamente aos scripts V1 do Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Logs (Visualizar scripts de migrations rodando)
logging.level.org.flywaydb=INFO

# JWT Configuration
# SEGURANCA: jwt.secret NUNCA deve ser hardcoded. Definir via variavel de ambiente.
jwt.secret=${JWT_SECRET}
# Access Token: 1 hora em milisegundos
jwt.access-token-expiration=3600000
# Refresh Token: 7 dias em milisegundos
jwt.refresh-token-expiration=604800000

# Pepper para Hash de Senhas (Argon2)
auth.pepper=${AUTH_PEPPER:}

# ─── CORS ────────────────────────────────────────────────────────────────
# Origens permitidas (separar por virgula). Ex: http://localhost:3000,https://meuapp.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ─── E-mail SMTP (Gmail) ────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ─── Swagger / OpenAPI ──────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

# ─── Actuator ───────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.info.env.enabled=true
info.app.name=Controle Financeiro Pessoal
info.app.description=API REST para controle financeiro pessoal
info.app.version=1.0.0
