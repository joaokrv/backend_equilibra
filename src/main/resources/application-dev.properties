# Perfil de Desenvolvimento Local — ativado com SPRING_PROFILES_ACTIVE=dev
# Este arquivo PODE ser versionado — nao contem segredos.

# CORS permissivo para desenvolvimento (Vite + React)
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:6006

# Swagger liberado em dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Cookies em dev local (http://localhost): Secure=true + SameSite=None é rejeitado por
# alguns browsers sobre HTTP. Lax + sem Secure permite o fluxo same-origin via proxy do Vite.
# Em PROD, COOKIE_SECURE=true e COOKIE_SAME_SITE=None vêm das env vars.
cookie.secure=false
cookie.same-site=Lax

# Permite token via header Authorization em dev (debug com curl/Postman sem cookie)
jwt.allow-header-auth=true
